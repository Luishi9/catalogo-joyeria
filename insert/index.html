<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Jewels - Insertar Producto</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <!-- Librerias para exportacion (JSON nativo + ZIP de imagenes) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* Estilos básicos para el formulario */
        .form-container {
            max-width: 600px;
            margin: 130px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            /* Para incluir padding en el ancho */
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group button.btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #a0522d;
            /* Color similar al de tu botón principal */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-group button.btn:hover {
            background-color: #8b4513;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* --- Exportacion --- */
        .export-section {
            max-width: 900px;
            margin: 40px auto 20px;
            padding: 20px 25px;
            background-color: #fffaf3;
            border: 1px solid #e8d9c5;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }
        .export-section h2 {
            font-size: 1.25rem;
            color: #5a3e1b;
            margin-bottom: 12px;
        }
        .export-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .export-buttons .btn-export {
            background-color: #a0522d;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .export-buttons .btn-export:hover:not(:disabled) {
            background-color: #8b4513;
        }
        .export-buttons .btn-export:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .export-buttons .btn-export.btn-secondary {
            background-color: #6c757d;
        }
        .export-buttons .btn-export.btn-secondary:hover:not(:disabled) {
            background-color: #565e64;
        }
        .progress-wrap {
            margin-top: 14px;
            background-color: #f1ece4;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
        }
        .progress-track {
            flex: 1;
            height: 18px;
            background-color: #e2d8c8;
            border-radius: 4px;
            overflow: hidden;
        }
        #export-progress-bar {
            height: 100%;
            width: 0%;
            background-color: #a0522d;
            transition: width 0.2s ease;
        }
        .progress-text {
            font-size: 13px;
            color: #5a3e1b;
            min-width: 70px;
            text-align: right;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>PLP <span>Jewels</span></h1>
            </div>
            <div class="user-bar">
                <span id="current-user-email" class="user-email"></span>
                <button id="logout-btn" type="button" class="btn-export btn-secondary">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main>
        <section class="form-section">
            <div class="container">
                <div class="form-container">
                    <h2>Insertar Nuevo Producto</h2>
                    <form id="productForm">
                        <div class="form-group">
                            <label for="productName">Nombre del Producto:</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label for="productDescription">Descripción:</label>
                            <textarea id="productDescription" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="productImage" class="form-label">Default file input example</label>
                            <input class="form-control" type="file" id="productImage" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label for="productCategory">Categoría:</label>
                            <select id="productCategory" required>
                                <option value="">Selecciona una categoría</option>
                                <option value="collares">Collares</option>
                                <option value="pulseras">Pulseras</option>
                                <option value="pendientes">Pendientes</option>
                                <option value="otros">Otros</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="productMaterial">Piedra(s) utilizada(s):</label>
                            <input type="text" id="productMaterial" required>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn">Agregar Producto</button>
                        </div>
                    </form>
                    <div id="messageContainer" class="message" style="display: none;"></div>
                </div>
            </div>
        </section>

        <section>
            <div class="container mb-5">

                <h2>Listado de productos.</h2>

                <div id="messageProductos" class="message" style="display: none;"></div>

                <div class="table-scroll">
                <table id="productos-table" class="table table-striped table-hover table-bordered mb-0">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Material</th>
                            <th>Imagen</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productos-body">
                        <!-- Los productos se cargarán dinámicamente aquí -->
                    </tbody>

                </table>
                </div>

                <div id="productos-pagination" class="pagination-controls" style="display: none;">
                    <button type="button" id="productos-prev" class="btn-pagination">« Anterior</button>
                    <span id="productos-page-info" class="pagination-info">Página 1 de 1</span>
                    <button type="button" id="productos-next" class="btn-pagination">Siguiente »</button>
                </div>

            </div>

        </section>

        <section>
            <div class="container text-center">
                <h2>Agregar informacion de piedra.</h2>

                <div class="form-container">
                    <form id="piedrasForm">
                        <div class="form-group">
                            <label for="nombrePiedra">Nombre de la Piedra:</label>
                            <input type="text" id="nombrePiedra" required>

                        </div>
                        <div class="form-group">
                            <label for="infoPiedra">Informacion de la Piedra:</label>
                            <textarea id="infoPiedra" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="piedraImage" class="form-label">Imagen de la piedra</label>
                            <input class="form-control" type="file" id="piedraImage" accept="image/*" required>

                        </div>
                          <div class="form-group">
                            <button type="submit" class="btn">Agregar Producto</button>
                        </div>
                    </form>
                    <div id="message2Container" class="message" style="display: none;"></div>
                </div>
            </div>
        </section>

         <section>
            <div class="container mb-5">

                <h2>Listado de piedras.</h2>

                <div id="messagePiedras" class="message" style="display: none;"></div>

                <div class="table-scroll">
                <table id="piedras-table" class="table table-striped table-hover table-bordered mb-0">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Informacion</th>
                            <th>Imagen</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="piedras-body">
                        <!-- Las piedras se cargarán dinámicamente aquí -->
                    </tbody>

                </table>
                </div>

                <div id="piedras-pagination" class="pagination-controls" style="display: none;">
                    <button type="button" id="piedras-prev" class="btn-pagination">« Anterior</button>
                    <span id="piedras-page-info" class="pagination-info">Página 1 de 1</span>
                    <button type="button" id="piedras-next" class="btn-pagination">Siguiente »</button>
                </div>

            </div>

        </section>

        <section class="export-section">
            <h2>Exportar datos</h2>
            <div class="export-buttons">
                <button id="btn-export-json" class="btn-export" type="button">
                    <i class="fa-solid fa-file-arrow-down"></i> Exportar JSON
                </button>
                <button id="btn-export-zip" class="btn-export btn-secondary" type="button">
                    <i class="fa-solid fa-images"></i> Exportar im&aacute;genes (ZIP)
                </button>
                <button id="btn-export-all" class="btn-export" type="button">
                    <i class="fa-solid fa-box-archive"></i> Exportar todo
                </button>
            </div>
            <div id="export-progress" class="progress-wrap d-none">
                <div class="progress-track">
                    <div id="export-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
                </div>
                <span class="progress-text" id="export-progress-text">0 / 0</span>
            </div>
        </section>

    </main>

    <script type="module" src="/src/pages/admin/insert.js"></script>
    <script type="module">
        import { initExportUI } from '/src/pages/admin/export.js';
        initExportUI();
    </script>
</body>

</html>
